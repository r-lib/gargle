# Temporary workflow to exercise workload identity federation (PR #321).
# Remove before merging.
on:
  pull_request:
  workflow_dispatch:

name: wif-test

permissions:
  contents: read
  id-token: write

jobs:
  wif-test:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: local::.

      # After installing gargle, so the credential file that auth writes into
      # the workspace can't end up in the built package
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/402252261770/locations/global/workloadIdentityPools/github/providers/gargle-repo
          service_account: gargle-gha-wif@gargle-wif.iam.gserviceaccount.com

      - name: Fetch a token via Application Default Credentials
        shell: Rscript {0}
        run: |
          cfg <- jsonlite::read_json(Sys.getenv("GOOGLE_APPLICATION_CREDENTIALS"))
          # Field names only; the headers hold a bearer token
          str(names(cfg))
          str(names(cfg$credential_source))

          options(gargle_verbosity = "debug")
          token <- gargle::token_fetch()
          print(class(token))
          print(gargle::token_email(token))

      # Like a client package, e.g. bigrquery
      - name: Fetch a token via ADC with an explicit scope
        shell: Rscript {0}
        run: |
          options(gargle_verbosity = "debug")
          token <- gargle::token_fetch(
            scopes = "https://www.googleapis.com/auth/bigquery"
          )
          print(class(token))
          print(token$params$scope)
          print(gargle::token_email(token))

      - name: Call credentials_external_account() directly
        shell: Rscript {0}
        run: |
          options(gargle_verbosity = "debug")
          token <- gargle::credentials_external_account(
            path = Sys.getenv("GOOGLE_APPLICATION_CREDENTIALS")
          )
          print(class(token))
          print(gargle::token_email(token))
